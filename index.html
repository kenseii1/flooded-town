<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a1215">
    <meta name="description" content="Row a small boat through a flooded town at night. Free in your browser.">
    <meta property="og:title" content="The Flooded Town">
    <meta property="og:description" content="Row a small boat through a flooded town at night. Free in your browser.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="The Flooded Town">
    <meta name="twitter:description" content="Row a small boat through a flooded town at night. Free in your browser.">
    <link rel="icon" href="data:,">
    <title>The Flooded Town</title>
    <style>
      html, body { position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; background: #0a1215; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      body { display: flex; flex-direction: column; }
      /* the notch and the home bar stay outside the canvas, so the touch buttons are always reachable */
      #stage { position: relative; flex: 1 1 auto; min-height: 0; margin: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #0a1215; touch-action: none; }
      #loading { position: absolute; left: 50%; top: 50%; width: 40%; min-width: 220px; transform: translate(-50%, -50%); color: #e9e3d6; font: 600 20px/1.4 Georgia, "Times New Roman", serif; letter-spacing: 0.08em; text-align: center; }
      #bar { height: 6px; margin-top: 14px; background: #1d2b30; }
      #fill { height: 100%; width: 0; background: #f0a24a; }
      #help { flex: 0 0 auto; padding: 6px 12px; color: #b9c6c8; font: 14px/1.4 system-ui, sans-serif; text-align: center; }
      #ft-stats { position: absolute; left: 4px; top: 4px; z-index: 5; max-width: 96%; padding: 2px 6px; background: rgba(0,0,0,.65); color: #9fe; font: 11px/1.3 monospace; pointer-events: none; }
      @media (pointer: coarse) { #help { display: none; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">The Flooded Town<div id="bar"><div id="fill"></div></div></div>
    </div>
    <div id="help">W row, A / D steer, Space hold still, F lantern, E use, R checkpoint, Esc controls. Click the game to look around with the mouse.</div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var query = new URLSearchParams(location.search);

      // Touch device: buttons show at once. Anything else gets them at its first real touch (FTTouchControls).
      var coarse = window.matchMedia("(pointer: coarse)").matches;
      window.__ftTouch = query.get("tier") ? query.get("tier") === "phone" : (coarse || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent));

      // Canvas resolution: real device pixels up to a cap. FTWebQuality lowers the render scale inside this canvas if frames are slow, so the HUD stays sharp.
      var dprCap = 2, pixelBudget = window.__ftTouch ? 1600000 : 3700000;
      function pixelRatio() {
        var wanted = parseFloat(query.get("dpr"));
        if (wanted > 0) return wanted;
        var w = Math.max(canvas.clientWidth, 1), h = Math.max(canvas.clientHeight, 1);
        return Math.max(1, Math.min(window.devicePixelRatio || 1, dprCap, Math.sqrt(pixelBudget / (w * h))));
      }
      if (query.get("stats")) { var stats = document.createElement("div"); stats.id = "ft-stats"; document.querySelector("#stage").appendChild(stats); }
      canvas.addEventListener("mousedown", function () { canvas.focus(); });

      // Phones: no page scroll, pinch or double-tap zoom, no long-press menu. The game listens on the canvas, so these never reach it.
      function stop(e) { e.preventDefault(); }
      ["gesturestart", "gesturechange", "gestureend", "dblclick", "contextmenu"].forEach(function (name) { document.addEventListener(name, stop, { passive: false }); });
      document.addEventListener("touchmove", stop, { passive: false });

      // Fullscreen + landscape on the first tap where the browser allows it (Android Chrome yes; iPhone Safari has no such call, the page just stays as it is).
      var triedFullscreen = false;
      function noop() {}
      function goFullscreen() {
        if (triedFullscreen || !window.matchMedia("(pointer: coarse)").matches || query.get("nofs")) return;
        triedFullscreen = true;
        var el = document.documentElement;
        var request = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!request) return;
        try {
          var p = request.call(el, { navigationUI: "hide" });
          var lock = function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(noop); };
          if (p && p.then) p.then(lock).catch(noop); else lock();
        } catch (e) {}
      }
      document.addEventListener("touchend", goFullscreen, { passive: true });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "kenseii1",
        productName: "The Flooded Town",
        productVersion: "0.1.0",
        devicePixelRatio: pixelRatio(),
      }, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function (unity) {
        window.__ftUnity = unity;
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
        window.addEventListener("resize", function () { unity.Module.devicePixelRatio = pixelRatio(); });
      }).catch(function (message) {
        document.querySelector("#loading").textContent = message;
      });
    </script>
  </body>
</html>
